<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bubble Level">
  <title>Digital Bubble Level</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
          </svg>
        </div>
        <div>
          <h1>Bubble Level</h1>
          <span class="subtitle">Precision Inclinometer</span>
        </div>
      </div>
      <div class="header-badges">
        <button id="installPwaBtn" class="badge badge-install hidden" title="Install App on Device">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Install</span>
        </button>
        <span id="calibrationBadge" class="badge badge-warning hidden">Calibrated</span>
        <span id="hardwareStatus" class="badge badge-neutral">Initializing...</span>
      </div>
    </header>

    <!-- iOS Permission Banner (shown only if required) -->
    <div id="iosPermissionBanner" class="permission-banner hidden">
      <div class="banner-content">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>iOS requires permission to access motion sensors.</span>
      </div>
      <button id="requestPermissionBtn" class="btn btn-primary">Enable Sensors</button>
    </div>

    <!-- Face-Down Frozen Banner with Unlock Button -->
    <div id="frozenBanner" class="frozen-banner hidden">
      <div class="frozen-info">
        <div class="frozen-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div>
          <span class="frozen-title">Misura Bloccata (Schermo Giù)</span>
          <span class="frozen-sub">Inclinazione registrata a faccia in giù</span>
        </div>
      </div>
      <button id="unfreezeBtn" class="btn btn-unlock">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
        <span>Sblocca / Riprendi</span>
      </button>
    </div>

    <!-- Main Level Display -->
    <main class="level-main">
      <!-- Target circular display (Bull's Eye) -->
      <div class="target-wrapper">
        <div id="levelTarget" class="level-target" title="Drag here with mouse on PC to simulate tilt">
          <!-- Concentric rings with degree markings -->
          <div class="ring ring-5" data-deg="5°"></div>
          <div class="ring ring-2" data-deg="2°"></div>
          <div class="ring ring-1" data-deg="1°"></div>
          <div class="ring ring-center"></div>

          <!-- Crosshairs -->
          <div class="crosshair crosshair-h"></div>
          <div class="crosshair crosshair-v"></div>

          <!-- The moving bubble -->
          <div id="bubble" class="bubble">
            <div class="bubble-inner"></div>
            <div class="bubble-glare"></div>
          </div>
        </div>
      </div>

      <!-- Center Digital Angle Readout -->
      <div class="readout-panel">
        <div class="main-readout">
          <span id="totalTiltDisplay" class="total-tilt">0.0</span>
          <span class="unit">°</span>
        </div>
        <div id="levelStatusText" class="level-status">PERFECTLY LEVEL</div>

        <!-- Axis Breakdown -->
        <div class="axis-details">
          <div class="axis-item">
            <span class="axis-label">X Axis (Roll)</span>
            <span id="gammaDisplay" class="axis-val">0.0°</span>
          </div>
          <div class="axis-item">
            <span class="axis-label">Y Axis (Pitch)</span>
            <span id="betaDisplay" class="axis-val">0.0°</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="app-controls">
      <div class="control-actions">
        <button id="tareBtn" class="btn btn-action" title="Zero the level on the current surface">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M12 3v18"></path>
          </svg>
          <span>Tare / Zero</span>
        </button>
        <button id="resetTareBtn" class="btn btn-secondary hidden" title="Restore factory calibration">
          <span>Reset</span>
        </button>
        <button id="toggleHapticsBtn" class="btn btn-icon active" title="Toggle Haptic / Vibration Feedback">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="2" width="12" height="20" rx="2"></rect>
            <line x1="10" y1="18" x2="14" y2="18"></line>
            <path d="M2 8a7 7 0 0 0 0 8"></path>
            <path d="M22 8a7 7 0 0 1 0 8"></path>
          </svg>
        </button>
      </div>

      <!-- Simulation notice for Desktop Testing -->
      <div id="simulationControls" class="sim-panel hidden">
        <div class="sim-header">
          <span class="sim-tag">Desktop Test Mode</span>
          <span class="sim-hint">Drag on target or use sliders</span>
        </div>
        <div class="sim-sliders">
          <label>Roll (X): <input type="range" id="simGamma" min="-10" max="10" step="0.1" value="0"></label>
          <label>Pitch (Y): <input type="range" id="simBeta" min="-10" max="10" step="0.1" value="0"></label>
          <label class="sim-check"><input type="checkbox" id="simFaceDown"> Face Down</label>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
